name: Build Filminho APK 1.0.38
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Keep only Build-Tools 35.0.0
        run: |
          for d in "$ANDROID_SDK_ROOT"/build-tools/*; do
            [ "$(basename "$d")" = "35.0.0" ] || rm -rf "$d"
          done
          ls "$ANDROID_SDK_ROOT/build-tools"
      - name: Decrypt current Android project (age)
        env:
          AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get install -y -qq age >/dev/null
          KEYFILE="$RUNNER_TEMP/age.key"
          printf '%s\n' "$AGE_KEY" > "$KEYFILE"
          mkdir -p "$RUNNER_TEMP/src"
          age -d -i "$KEYFILE" -o "$RUNNER_TEMP/project.zip" update-input.zip.age
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/src"
          rm -f "$KEYFILE" "$RUNNER_TEMP/project.zip"
          test -f "$RUNNER_TEMP/src/app/release.keystore"
          grep -Fq 'versionCode 38' "$RUNNER_TEMP/src/app/build.gradle"
          grep -Fq 'versionName "1.0.38"' "$RUNNER_TEMP/src/app/build.gradle"
      - name: Build signed APK
        working-directory: ${{ runner.temp }}/src
        run: bash ./build-release.sh
      - name: Independent validation
        working-directory: ${{ runner.temp }}/src
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n1)
          test -n "$APK"
          "$BT/aapt" dump badging "$APK" | head -n1 | tee badging.txt
          grep -Fq "package: name='com.filminho.app' versionCode='38' versionName='1.0.38'" badging.txt
          "$BT/apksigner" verify --verbose "$APK"
          SIGNER_OUTPUT=$("$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1)
          printf '%s\n' "$SIGNER_OUTPUT" | tee signer.txt
          EXPECTED_SIGNER='1a86f35340b3f3a7f3e21157cce01fefa0e3989e6c9595394d156931538807d0'
          printf '%s\n' "$SIGNER_OUTPUT" | tr '[:upper:]' '[:lower:]' | grep -Fq "$EXPECTED_SIGNER"
          unzip -l "$APK" | grep -q 'assets/web/capacitor-index.html'
          {
            while IFS= read -r dex; do unzip -p "$APK" "$dex"; done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          } | strings > dex-strings.txt
          grep -Fq 'filminhooo.lovable.app' dex-strings.txt
          if grep -Fq 'servirAssetWeb' dex-strings.txt; then
            echo 'APK ainda contém o servidor de assets web antigo.' >&2
            exit 1
          fi
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          mkdir -p "$(dirname "$APK")"
          cat > "$(dirname "$APK")/build-verification.txt" <<EOF
          Result: PASS
          Version: 1.0.38 (versionCode 38)
          Web origin: https://filminhooo.lovable.app
          Signer SHA-256: $EXPECTED_SIGNER
          APK SHA-256: $APK_SHA256
          EOF
          echo 'APK validation passed: version, remote web host, signature and no local asset interception.'
      - name: Upload APK artifact (1 day)
        uses: actions/upload-artifact@v4
        with:
          name: filminho-1.0.38-apk
          path: |
            ${{ runner.temp }}/src/app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/src/app/build/outputs/apk/release/build-verification.txt
          retention-days: 1
          if-no-files-found: error
      - name: Publish APK to stable branch and releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH=$(find "$RUNNER_TEMP/src/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | sort | head -n1)
          test -n "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/filminho.apk"

          BRANCH_DIR="$RUNNER_TEMP/apk-branch"
          git clone --quiet --depth 1 --branch apk "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH_DIR"
          cp "$RUNNER_TEMP/filminho.apk" "$BRANCH_DIR/filminho.apk"
          cd "$BRANCH_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filminho.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Filminho APK 1.0.38"
            git -c "http.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}" push origin HEAD:refs/heads/apk
          fi

          cd "$GITHUB_WORKSPACE"
          if gh release view v1.0.38 >/dev/null 2>&1; then
            gh release upload v1.0.38 "$RUNNER_TEMP/filminho.apk" --clobber
          else
            gh release create v1.0.38 "$RUNNER_TEMP/filminho.apk" \
              --target main \
              --title "Filminho 1.0.38" \
              --notes "APK 1.0.38. Esta versão carrega o site remoto https://filminhooo.lovable.app para receber futuras atualizações web sem recompilar o APK."
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$RUNNER_TEMP/filminho.apk" --clobber
          else
            gh release create latest "$RUNNER_TEMP/filminho.apk" \
              --target main \
              --title "Filminho APK — sempre a versão mais recente" \
              --notes "Link permanente do APK mais recente. O artefato é atualizado a cada build."
          fi
          echo "Stable latest release: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/filminho.apk"
          echo "Stable raw artifact: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk/filminho.apk"
